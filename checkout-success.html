<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — The Haus by DOW</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #F5EFE6; --brown-dark: #5C3D24; --gold: #C9A84C;
    --text-mid: #6B4C30; --text-light: #9E7D5F; --white: #FDFAF6;
  }
  body { font-family: 'Jost', sans-serif; background: var(--white); color: var(--brown-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { text-align: center; max-width: 420px; padding: 3rem 2.5rem; background: var(--cream); border: 0.5px solid rgba(201,168,76,0.35); }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 400; margin-bottom: 0.75rem; }
  p { font-size: 0.92rem; font-weight: 300; color: var(--text-mid); line-height: 1.75; margin-bottom: 1.5rem; }
  a { font-size: 0.65rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-mid); text-decoration: none; border-bottom: 0.5px solid var(--gold); padding-bottom: 2px; transition: color 0.3s; }
  a:hover { color: var(--gold); }
  .eyebrow { font-size: 0.58rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">The Haus by DOW</p>
    <h1>Thank you</h1>
    <p>Your payment went through. Check your email for your receipt and download instructions for your digital files.</p>
    <a href="index.html">Back to The Haus</a>
  </div>
</body>
</html>
