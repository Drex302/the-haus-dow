<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your cart — The Haus by DOW</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --nude: #D9C4B0; --cream: #F5EFE6; --cream-deep: #EDE3D5;
    --brown: #8B6347; --brown-dark: #5C3D24;
    --gold: #C9A84C; --gold-light: #E8D08A;
    --white: #FDFAF6; --text-dark: #3A2510; --text-mid: #6B4C30; --text-light: #9E7D5F;
  }
  body { font-family: 'Jost', sans-serif; background: var(--white); color: var(--text-dark); min-height: 100vh; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 4rem;
    background: rgba(253,250,246,0.95); backdrop-filter: blur(12px);
    border-bottom: 0.5px solid rgba(201,168,76,0.3);
  }
  .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 400; letter-spacing: 0.15em; color: var(--brown-dark); text-transform: uppercase; line-height: 1.1; text-decoration: none; display: block; }
  .nav-sub { font-size: 0.55rem; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; display: block; margin-top: 2px; }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mid); text-decoration: none; transition: color 0.3s; }
  .nav-links a:hover { color: var(--gold); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .nav-cart { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-mid); text-decoration: none; }
  .nav-cart:hover { color: var(--gold); }
  [data-cart-badge] { display: none; background: var(--gold); color: var(--brown-dark); border-radius: 999px; padding: 0.12rem 0.45rem; font-size: 0.55rem; margin-left: 0.2rem; font-weight: 500; }
  .nav-cta { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--white); background: var(--brown-dark); border: none; padding: 0.6rem 1.5rem; cursor: pointer; transition: background 0.3s; text-decoration: none; }
  .nav-cta:hover { background: var(--gold); }

  .cart-page { max-width: 560px; margin: 0 auto; padding: 7.5rem 1.5rem 4rem; }
  .cart-page h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 400; color: var(--brown-dark); margin-bottom: 0.5rem; }
  .cart-page .eyebrow { font-size: 0.58rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; }

  .cart-empty { text-align: center; padding: 3rem 1rem; background: var(--cream); border: 0.5px solid rgba(201,168,76,0.25); }
  .cart-empty-label { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; color: var(--brown-dark); margin-bottom: 0.75rem; }
  .cart-empty-hint { font-size: 0.88rem; font-weight: 300; color: var(--text-mid); margin-bottom: 1.5rem; line-height: 1.6; }

  .cart-panel { background: var(--cream); border: 0.5px solid rgba(201,168,76,0.25); padding: 1.5rem; }
  .cart-line { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 1rem 0; border-bottom: 0.5px solid var(--cream-deep); }
  .cart-line:last-of-type { border-bottom: none; }
  .cart-line-info { flex: 1; display: flex; flex-direction: column; gap: 0.25rem; }
  .cart-line-name { font-size: 0.88rem; font-weight: 400; color: var(--text-dark); line-height: 1.4; }
  .cart-line-price { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; color: var(--brown-dark); }
  .cart-line-remove { font-size: 0.58rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-light); background: none; border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; flex-shrink: 0; }
  .cart-line-remove:hover { color: var(--gold); }

  .cart-subtotal-row { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 0 0.5rem; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--brown-dark); border-top: 0.5px solid rgba(201,168,76,0.35); margin-top: 0.5rem; }
  .cart-subtotal-row span:last-child { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; letter-spacing: 0.02em; }

  .cart-actions { margin-top: 1.25rem; }
  .cart-btn-primary {
    font-family: 'Jost', sans-serif; font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--white); background: var(--brown-dark); border: 1px solid var(--brown-dark);
    padding: 1rem 1.5rem; cursor: pointer; transition: all 0.3s;
  }
  .cart-btn-primary:hover { background: var(--gold); border-color: var(--gold); }
  .cart-btn-full { width: 100%; }
  .cart-btn-primary + .cart-btn-primary { margin-top: 0.65rem; }
  .cart-note { font-size: 0.72rem; font-weight: 300; color: var(--text-mid); margin-top: 0.85rem; line-height: 1.5; }
  .cart-split-note { font-size: 0.78rem; font-weight: 300; color: var(--text-mid); line-height: 1.65; margin-bottom: 1rem; }
  .cart-split-note code { font-size: 0.72rem; background: var(--white); padding: 0.1rem 0.35rem; border: 0.5px solid var(--nude); }
  .cart-continue { display: inline-block; margin-top: 1.25rem; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-mid); text-decoration: none; border-bottom: 0.5px solid var(--gold); padding-bottom: 2px; }
  .cart-continue:hover { color: var(--gold); }

  footer { text-align: center; padding: 3rem 1.5rem 2rem; }
  .footer-copy { font-size: 0.68rem; color: var(--text-light); }

  @media (max-width: 900px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">The Haus <span class="nav-sub">by DeeOnlyWay</span></a>
  <ul class="nav-links">
    <li><a href="index.html#offerings">Shop</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#connect">Connect</a></li>
  </ul>
  <div class="nav-right">
    <a href="cart.html" class="nav-cart">Cart <span data-cart-badge></span></a>
    <a href="index.html#offerings" class="nav-cta">Shop The Haus</a>
  </div>
</nav>

<main class="cart-page">
  <p class="eyebrow">The Haus by DOW</p>
  <h1>Your cart</h1>
  <div id="cart-root"></div>
</main>

<footer>
  <p class="footer-copy">© 2026 DeeOnlyWay · The Haus by DOW</p>
</footer>

<script src="js/checkout.config.js"></script>
<script src="js/cart.js"></script>
<script>
  renderCartPage();
  window.addEventListener('thehaus-cart-updated', renderCartPage);
</script>
</body>
</html>
